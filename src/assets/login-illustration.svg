<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%" fill="none">
  <!-- Soft background element if needed, though parent container will have it -->
  
  <!-- Floating decorative stars/circles -->
  <!-- Star 1 Left -->
  <path d="M 125 160 L 125 170 M 120 165 L 130 165" stroke="#718096" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="125" cy="165" r="1.5" fill="#718096" />
  
  <!-- Star 2 Right -->
  <path d="M 330 195 L 330 205 M 325 200 L 335 200" stroke="#718096" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="330" cy="200" r="1.5" fill="#718096" />
  
  <!-- Circle bubble -->
  <circle cx="270" cy="180" r="4.5" stroke="#718096" stroke-width="1.5" fill="none"/>
  
  <!-- The Desk Table -->
  <!-- Table Top -->
  <rect x="70" y="210" width="280" height="7" rx="3.5" fill="#5A6A80" />
  
  <!-- Table Legs -->
  <line x1="75" y1="217" x2="75" y2="275" stroke="#5A6A80" stroke-width="1.5" />
  <line x1="145" y1="217" x2="145" y2="275" stroke="#5A6A80" stroke-width="1.5" />
  <line x1="280" y1="217" x2="280" y2="275" stroke="#5A6A80" stroke-width="1.5" />
  <line x1="345" y1="217" x2="345" y2="275" stroke="#5A6A80" stroke-width="1.5" />

  <!-- Character -->
  <!-- Main Column Body (Test Tube / hourglass style) -->
  <path d="M 175 160 C 175 220 168 220 168 280 L 202 280 C 202 220 195 220 195 160 Z" fill="#FFFFFF" stroke="#4A5568" stroke-width="1.5" stroke-linejoin="round"/>
  
  <!-- Cap / Graduation Top (Blue cap details) -->
  <rect x="156" y="145" width="58" height="5" fill="#A0C4FF" />
  <line x1="163" y1="150" x2="207" y2="150" stroke="#4A5568" stroke-width="1.5" />
  <!-- Bottom Base plate -->
  <rect x="156" y="280" width="58" height="5" fill="#A0C4FF" />
  <line x1="163" y1="280" x2="207" y2="280" stroke="#4A5568" stroke-width="1.5" />

  <!-- Eyes & Smile -->
  <circle cx="180" cy="188" r="2" fill="#000000" />
  <circle cx="190" cy="188" r="2" fill="#000000" />
  <path d="M 183 193 Q 185 195 187 193" stroke="#000000" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  
  <!-- Tiny blush dots -->
  <circle cx="177" cy="190" r="1" fill="#FF8A8A" />
  <circle cx="193" cy="190" r="1" fill="#FF8A8A" />
  
  <!-- Arms & Hands -->
  <!-- Left Arm (to Laptop) -->
  <path d="M 170 210 Q 185 210 200 208" stroke="#4A5568" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <!-- Right Arm (leaning) -->
  <path d="M 198 210 Q 215 210 230 216" stroke="#4A5568" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <!-- Right Hand/Fingers resting on desk -->
  <path d="M 230 216 C 235 217 236 226 230 228 C 224 230 221 219 230 216" stroke="#4A5568" stroke-width="1.5" fill="#FFFFFF"/>

  <!-- Laptop -->
  <!-- Screen Lid (angled) -->
  <polygon points="90,180 160,180 178,210 108,210" fill="#E2E8F0" stroke="#4A5568" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Base of Laptop (under desk) -->
  <polygon points="108,210 178,210 183,212 113,212" fill="#CBD5E0" stroke="#4A5568" stroke-width="1.5" stroke-linejoin="round"/>
</svg>
